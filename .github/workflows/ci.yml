name: Verify Homewise
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - name: Verify Java core and API
        run: mvn -B -f backend/pom.xml verify
      - name: Build frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
      - name: Install browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Start application
        run: bash scripts/start.sh
      - name: Independent HTTP acceptance
        run: python3 scripts/verify_api.py
      - name: Bilingual rendering and API text coverage
        run: pnpm --dir frontend test:i18n
        env:
          BASE_URL: http://localhost:8080
      - name: Browser integration
        run: pnpm --dir frontend test:e2e
        env:
          BASE_URL: http://localhost:8080
      - name: Keep validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
            frontend/playwright-report/
            frontend/test-results/
            .runtime/app.log
            .runtime/api-verification.json
