services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homewise
      POSTGRES_USER: homewise
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    volumes:
      - homewise-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homewise -d homewise"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/homewise
      SPRING_DATASOURCE_USERNAME: homewise
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
volumes:
  homewise-data:
